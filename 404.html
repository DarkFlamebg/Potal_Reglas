<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0813">

  <!-- SEO propio de esta página: título, descripción y dirección -->
  <title>Página no encontrada · Dixel RP</title>
  <meta name="description" content="La página que buscas no existe.">
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/png" href="img/dixel-logo.png">
  <link rel="apple-touch-icon" href="img/dixel-logo.png">

  <!-- Tipografía: una sola familia, Archivo, en dos anchos
       (ancho para títulos, al estilo de los menús del juego; normal para el texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">

  <link rel="stylesheet" href="css/styles.css">
  <!-- data.js = contenido · layout.js = barra, menú y pie · app.js = lógica -->
  <script src="js/data.js" defer></script>
  <script src="js/layout.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body data-page="404">
  <!-- La barra superior, el menú y el pie se dibujan desde js/layout.js
       (un solo sitio para todas las páginas). Aquí va el contenido de
       la sección que indica data-page. -->
  <main id="contenido" class="container" tabindex="-1"></main>

  <noscript>
    <p class="noscript">Este portal necesita JavaScript activado para mostrar su contenido.</p>
  </noscript>
</body>
</html>
